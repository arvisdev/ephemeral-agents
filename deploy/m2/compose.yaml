# M2 — lifecycle + worker deployment on vm-xb
# Source: version 1/installation-deployment/M2-Lifecycle-Installation-and-Deployment.md §2
services:
  lifecycle:
    image: "poc/lifecycle:1.0.0"
    environment:
      DOCKER_HOST: "unix:///var/run/docker.sock"
      LISTEN: "0.0.0.0:8090"                  # compose-network only (loopback would lock the worker out)
      REAPER_INTERVAL: "30s"
      POC_TTL_DEFAULT: "900s"                  # TTL default when the message carries no ttl_s (owner-settled hybrid). Units: the lifecycle config takes a Go duration string ("900s"); message ttl_s is integer seconds
      POC_IMAGE: "poc/executor-stub:1.0.0"     # pinned — no pulls at activity time
      # M3 §2' — POC_IMAGE is a config switch per executor type; the stub pin
      # stays until the M3 executor tags pass (rollback rule, M3 §6)
      POC_IMAGE_HERMES: "192.168.0.197:5000/poc/hermes-ephemeral:1.0.0"
      POC_IMAGE_CODER: "192.168.0.197:5000/poc/claude-coder:1.0.0"
      # M3 §2 — per-run env sourced from the secret file (never in git/images);
      # file must exist before M3 gate runs (install.sh §1 verifies)
    env_file:
      - /opt/poc/secrets/m3.env                       # M3 §2 per-run secrets (never in git/images)
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/opt/poc/deploy/m3:/opt/poc/deploy/m3:ro"   # M3 §1c: token-issuance script
      - "/opt/poc/secrets:/opt/poc/secrets:ro"          # M3 §1c: app-key.pem (read-only)   # rw: lifecycle spawns/reaps containers
      - "/var/poc/tasks:/var/poc/tasks"               # per-task log volume (§4 retention)
    restart: unless-stopped
    # deploy gate (deploy/m2/install.sh): the service entrypoint RUNS `docker image inspect poc/executor-stub:1.0.0`
    # on boot and refuses to serve until the pinned image exists locally (the no-pull rule, enforced).
  worker:
    image: "poc/worker:1.0.0"
    # Dockerfile.services shares one ENTRYPOINT (lifecycle); the worker image
    # must run the worker binary — override here (the doc's two-images-one-build
    # transcription omitted the role split)
    entrypoint: ["/usr/local/bin/worker"]
    environment:
      TEMPORAL_ADDR: "temporal:7233"
      LIFECYCLE_API: "http://lifecycle:8090"     # same compose project; expose the API to this network
      # response publisher (M2 §1c) — declare agent.tasks.response (M0 §3)
      RABBITMQ_URL: "amqp://poc:${RABBITMQ_PASS}@rabbitmq:5672/"
    depends_on: [lifecycle]
    restart: unless-stopped
# shared external network (poc-net) — M0 containers carry the rabbitmq/temporal
# aliases; same wiring as M1 (created/connected by deploy/m1/install.sh and by
# deploy/m2/install.sh's §3 — idempotent)
networks:
  default:
    external: true
    name: poc-net
